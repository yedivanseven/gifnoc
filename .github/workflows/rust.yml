name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:


env:
  CARGO_TERM_COLOR: always


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Format
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --all-features -- -D warnings
    - name: Build
      run: cargo build --all-features --verbose
    - name: Test
      run: cargo test --all-features --verbose
