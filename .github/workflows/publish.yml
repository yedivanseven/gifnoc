name: Publish

on:
  release:
    types: [released]


jobs:
  publish:

    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'

    steps:
      - uses: actions/checkout@v6
      - uses: caido/action-publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
