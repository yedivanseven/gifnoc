[workspace]
members = [
    ".",
    "gifnoc-macros",
]
resolver = "2"

[package]
name = "gifnoc"
version = "0.1.1"
edition = "2024"
description = "Type-safe configuration with layered overrides via a proc-macro DSL"
license = "MIT"
repository = "https://github.com/yedivanseven/gifnoc"
keywords = ["config", "configuration", "cli", "env", "macro"]
categories = ["config", "command-line-interface"]

[dependencies]
gifnoc-macros = { path = "gifnoc-macros", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", optional = true }
serde_yml = { version = "0.0", optional = true }

[features]
default = []
toml = ["dep:toml"]
yaml = ["dep:serde_yml"]
